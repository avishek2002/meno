schema_version: 1
slug: agent-harness-craft
title: Agent harness craft
created: 2026-08-05
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./agent-harness-craft-hub.md
objectives:
  - id: O1
    text: Explain how an agent harness assembles base instructions, tool definitions, and conversation history into one context window, and trace one loop iteration from model tool call to returned result
    bloom: understand
    assessed_by: a written trace of a single agent turn from a real transcript, labeling the instructions, the tool schema, the tool call, and the tool result
  - id: O2
    text: Apply tiered instruction files and subagent delegation to keep a working session's context lean
    bloom: apply
    assessed_by: a reorganized instruction-file set (user, project, on-demand) plus one delegated side task whose only trace in the main session is a summary
  - id: O3
    text: Evaluate whether a recurring workflow deserves a reusable skill, an always-loaded instruction, or a one-off prompt, and structure a skill with progressive disclosure
    bloom: evaluate
    assessed_by: a decision memo on three candidate workflows plus one drafted skill whose detailed body loads only on demand
  - id: O4
    text: Design event-driven hooks and permission rules that enforce guardrails deterministically, failing closed where the model's judgment must not be the last line of defense
    bloom: create
    assessed_by: a guardrail design for a given risky workflow naming the lifecycle event, the blocking behavior, and the permission rules that back it up
  - id: O5
    text: Evaluate which model tier a task needs, route work to the cheapest capable model, and verify the routing against usage instrumentation
    bloom: evaluate
    assessed_by: a routing table for a week of real tasks with measured cost deltas read from the session's usage tooling
