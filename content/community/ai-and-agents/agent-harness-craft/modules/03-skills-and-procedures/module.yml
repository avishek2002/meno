objectives:
  - id: M3-1
    text: Describe how a skill packages a repeatable procedure as a discoverable folder of instructions, supporting files, and scripts
    bloom: understand
  - id: M3-2
    text: Explain progressive disclosure, where a skill's metadata loads at startup, its body on invocation, and its linked files only when needed
    bloom: understand
  - id: M3-3
    text: Judge whether a recurring workflow belongs in a skill, an always-loaded instruction file, or a one-off prompt
    bloom: evaluate
