  - title: "Claude docs: Reduce hallucinations"
    url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
    archived_url: https://web.archive.org/web/20261004113937/https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
    accessed: 2026-10-09
    source_type: web
    why: lists practical techniques such as allowing the model to say it does not know and requiring quotes from sources, anchoring the checking-ai-claims lesson
