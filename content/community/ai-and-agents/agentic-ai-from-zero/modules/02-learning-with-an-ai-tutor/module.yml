  - title: "Cepeda et al. (2006): Distributed practice in verbal recall tasks"
    url: https://pubmed.ncbi.nlm.nih.gov/16719566/
    archived_url: https://web.archive.org/web/20261006074447/https://pubmed.ncbi.nlm.nih.gov/16719566/
    accessed: 2026-10-09
    source_type: web
    why: meta-analysis of 839 assessments showing the best gap between study sessions grows with the retention interval, anchoring the spaced-review lesson
  - title: "Bloom (1984): The 2 Sigma Problem (ERIC record)"
    url: https://eric.ed.gov/?id=EJ303699
    archived_url: https://web.archive.org/web/20260919214101/https://eric.ed.gov/?id=EJ303699
    accessed: 2026-10-09
    source_type: web
