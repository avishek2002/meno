objectives:
  - id: M2-1
    text: Write prompts that state the task, constraints, and examples explicitly, and iterate on them against real outputs
    bloom: apply
  - id: M2-2
    text: Manage the context window on long tasks, predicting what happens as it fills and deciding what to include or drop
    bloom: apply
  - id: M2-3
    text: Choose sampling settings to match the task, near-deterministic for extraction and looser for ideation
    bloom: apply
  - id: M2-4
    text: Produce machine-parseable model output, valid JSON (JavaScript Object Notation) against a schema, fit for scripts and pipelines
    bloom: apply
