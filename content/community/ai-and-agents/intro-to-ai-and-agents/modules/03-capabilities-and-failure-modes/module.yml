schema_version: 1
module: 03-capabilities-and-failure-modes
title: Capabilities and failure modes
status: skeleton
serves: [O3]
prerequisites: [02-working-with-models]
est_hours: 3
concepts:                      # siblings: the three failure modes a caller must anticipate
  - hallucination
  - knowledge-cutoffs
