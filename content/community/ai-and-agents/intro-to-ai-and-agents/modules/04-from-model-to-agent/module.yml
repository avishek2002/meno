objectives:
  - id: M4-1
    text: Explain the tool-use round trip, where the model emits a structured call, the harness executes it, and the result returns as context
    bloom: understand
  - id: M4-2
    text: Distinguish workflows, predefined code paths that call models, from agents, where the model directs its own tool use in a loop
    bloom: understand
  - id: M4-3
    text: Analyze a multi-step task into an agent plan of tool calls, observations, checks, and a stopping condition, and identify where it can fail
    bloom: analyze
