    why: the canonical record of how a hosted model API is consumed - API keys, required headers, the Messages endpoint, SDKs, rate limits - for the model-APIs lesson
  - title: "The Llama 3 Herd of Models (Grattafiori et al.)"
    url: https://arxiv.org/abs/2407.21783
    archived_url: https://web.archive.org/web/20260731092016/https://arxiv.org/abs/2407.21783
    accessed: 2026-08-05
