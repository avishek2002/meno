  - title: "Model Context Protocol: What is MCP?"
    url: https://modelcontextprotocol.io/docs/2026-07-28/getting-started/intro
    archived_url: https://web.archive.org/web/20260805094239/https://modelcontextprotocol.io/docs/2026-07-28/getting-started/intro
    accessed: 2026-08-05
    source_type: web
    why: the open standard for connecting AI applications to external tools and data, the integration surface the agents-in-workflows lesson maps
  - title: "Anthropic engineering: Building effective agents"
    url: https://www.anthropic.com/engineering/building-effective-agents
    archived_url: https://web.archive.org/web/20260805092535/https://www.anthropic.com/engineering/building-effective-agents
    accessed: 2026-08-05
    source_type: web
    why: guidance on when a workflow suffices and when an agent is warranted, grounding the where-agents-fit lesson's placement decisions
