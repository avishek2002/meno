schema_version: 1
module: 02-sycophancy
title: Sycophancy - telling you what you want to hear
status: skeleton
serves: [O2]
prerequisites: []
est_hours: 3
concepts:                      # siblings: the behavior, its training-data origin, detecting it
  - sycophancy-behavior
