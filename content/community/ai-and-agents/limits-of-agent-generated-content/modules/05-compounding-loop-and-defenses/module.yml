schema_version: 1
module: 05-compounding-loop-and-defenses
title: The compounding loop and its defenses
status: skeleton
serves: [O5]
prerequisites: [01-hallucination, 02-sycophancy, 03-cognitive-offloading, 04-dunning-kruger-and-calibration]
est_hours: 4
concepts:                      # siblings: the loop itself, then three evidence-backed interrupts
  - compounding-loop
  - verification-rituals
  - citation-checking
  - retrieval-practice
objectives:
  - id: M5-1
    text: Analyze how hallucination, sycophancy, offloading, and miscalibration reinforce one another into a loop that hides its own damage
    bloom: analyze
  - id: M5-2
    text: Evaluate verification rituals for an agent-produced deliverable, preferring external checks over model self-review, which the evidence shows is unreliable
    bloom: evaluate
  - id: M5-3
    text: Check agent-generated references by verifying each cited work exists and supports the claim it is attached to
    bloom: apply
  - id: M5-4
    text: Apply retrieval practice - testing memory rather than re-reading - to keep real understanding of material an agent helped produce
    bloom: apply
sources:                       # 3, each fetched this session; see sourcing.md
  - title: "Fabrication and Errors in the Bibliographic Citations Generated by ChatGPT (Walters and Wilder, Scientific Reports)"
    url: https://www.nature.com/articles/s41598-023-41032-5
    archived_url: https://web.archive.org/web/20260805093617/https://www.nature.com/articles/s41598-023-41032-5?error=cookies_not_supported&code=a0ced34e-f34d-4d90-8c89-b6172d209438
    accessed: 2026-08-05
    source_type: web
    why: measured fabrication directly - 55 percent of GPT-3.5 citations and 18 percent of GPT-4 citations were invented, and many real ones carried substantive errors - the citation-checking lesson's motivating evidence
  - title: "Large Language Models Cannot Self-Correct Reasoning Yet (Huang et al., International Conference on Learning Representations)"
    url: https://arxiv.org/abs/2310.01798
    archived_url: https://web.archive.org/web/20260803175403/https://arxiv.org/abs/2310.01798
    accessed: 2026-08-05
    source_type: web
    why: shows models struggle to self-correct without external feedback and sometimes get worse after trying - why the verification lesson insists checks be external to the model
  - title: "Test-Enhanced Learning (Roediger and Karpicke, Psychological Science) - PubMed record"
    url: https://pubmed.ncbi.nlm.nih.gov/16507066/
    archived_url: https://web.archive.org/web/20260805093712/https://pubmed.ncbi.nlm.nih.gov/16507066/
    accessed: 2026-08-05
    source_type: web
    why: the testing-effect study - retrieval beats restudying for delayed retention even though restudying feels better - grounding for the retrieval-practice defense; publisher page blocks automated access, so the National Library of Medicine record is the cited copy
