objectives:
  - id: M2-1
    text: Explain why providers ship model families in capability tiers whose prices differ by an order of magnitude, and what each tier is priced to be good at
    bloom: understand
  - id: M2-2
    text: Analyze a task's difficulty signals to decide the tier it actually needs, resisting the default of sending everything to the flagship
    bloom: analyze
  - id: M2-3
    text: Analyze a cascade design - inexpensive model first, escalate on weak answers - and place the fallback to a stronger model where escalation runs out
    bloom: analyze
