schema_version: 1
module: 04-baselines-and-gates
title: Baselines, guard bands, and gates
status: skeleton
serves: [O4]
prerequisites: [02-scorer-taxonomy]
est_hours: 4
concepts:                      # gate mechanics, then the noise math, then the two disciplines that keep gates honest
  - regression-gating
  - guard-bands
  - rebaselining
  - run-history
objectives:
  - id: M4-1
    text: Apply a regression gate that fails a change when suite scores fall below the stored baseline
    bloom: apply
  - id: M4-2
    text: Analyze score movement against measurement noise - standard errors, clustering, paired comparisons - to size a guard band that neither flaps on noise nor sleeps through regressions
    bloom: analyze
  - id: M4-3
    text: Evaluate when a baseline may move - deliberate, recorded rebaselining versus silent drift - and keep an append-only run history that makes every move auditable
    bloom: evaluate
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "CI/CD integration (promptfoo documentation)"
