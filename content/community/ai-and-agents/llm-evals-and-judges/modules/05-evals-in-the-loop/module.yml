objectives:
  - id: M5-1
    text: Apply the eval-first loop to prompt work - success criteria and empirical tests defined before touching the prompt, suite scores judging every revision
    bloom: apply
  - id: M5-2
    text: Evaluate a model upgrade by rerunning the suite and reading capability and regression movement, instead of re-testing behavior by hand
    bloom: evaluate
  - id: M5-3
    text: Evaluate the suite itself over time - saturation, stale examples, graders drifting from intent - and refresh it deliberately
    bloom: evaluate
