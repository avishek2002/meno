schema_version: 1
slug: rag-grounding-and-faithfulness
title: RAG grounding and faithfulness
created: 2026-08-05
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./rag-grounding-and-faithfulness-hub.md
objectives:
  - id: O1
    text: Explain why retrieval augmentation is the engineering response to parametric knowledge limits, covering long-tail gaps, stale training data, and missing attribution
    bloom: understand
    assessed_by: a written case for or against adding retrieval to a described system, arguing from the long-tail, freshness, and attribution evidence
  - id: O2
    text: Apply chunking, embedding, hybrid lexical-plus-semantic retrieval, and reranking choices to build a pipeline that surfaces the passages a question needs
    bloom: apply
    assessed_by: a working retrieval pipeline over a small corpus, with a short justification of each chunking, search, and reranking choice
  - id: O3
    text: Apply grounding instructions, inline citation formats, and forced abstention on empty retrieval so generated answers point at their sources or decline
    bloom: apply
    assessed_by: a generation stage whose answers carry passage-level citations and which demonstrably abstains when retrieval returns nothing relevant
  - id: O4
    text: Evaluate a retrieval-augmented system with faithfulness and answer-relevance metrics over a labelled evaluation set, separating retrieval quality from generation quality
    bloom: evaluate
    assessed_by: a scored evaluation run over a hand-labelled question set, with a written reading of which stage each low score implicates
  - id: O5
    text: Analyze grounded-system failures, from retrieval misses through context-ignoring generation to deference to wrong premises in the query, and match each to the diagnostic that catches it
    bloom: analyze
    assessed_by: a written diagnosis of provided failing transcripts, classifying each failure by pipeline stage and naming the check that would have caught it
