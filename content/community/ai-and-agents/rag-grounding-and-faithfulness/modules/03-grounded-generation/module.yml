    accessed: 2026-08-05
    source_type: web
    why: vendor documentation of passage-level citation output - documents chunked to sentence granularity, cited text returned with document indices, guaranteed to point at the provided sources
  - title: "Know Your Limits: A Survey of Abstention in Large Language Models (Wen et al., TACL 2024)"
    url: https://arxiv.org/abs/2407.18418
    archived_url: https://web.archive.org/web/20260719194027/https://arxiv.org/abs/2407.18418
    accessed: 2026-08-05
