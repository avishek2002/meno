schema_version: 1
module: 03-grounded-generation
title: The generation side - grounding, citations, abstention
status: skeleton
serves: [O3]
prerequisites: [02-the-retrieval-side]
est_hours: 3
concepts:                      # constrain the generator: answer from passages, show which, or decline
  - grounding-instructions
  - citation-formats
  - forced-abstention
objectives:
  - id: M3-1
    text: Apply grounding instructions that constrain answers to the retrieved passages, and test that the constraint holds
    bloom: apply
  - id: M3-2
    text: Apply a citation format that ties each claim to a specific retrieved passage, at a granularity a reader can verify
    bloom: apply
  - id: M3-3
    text: Apply forced abstention - when retrieval returns nothing relevant, the system declines instead of answering from weights
    bloom: apply
sources:                       # 2, each fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Citations (Claude API documentation)"
