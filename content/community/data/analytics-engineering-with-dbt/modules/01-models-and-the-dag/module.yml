objectives:
  - id: M1-1
    text: Explain what a dbt model is - one SELECT statement per file that dbt wraps in create view as or create table as at run time
    bloom: understand
  - id: M1-2
    text: Explain how ref() both resolves a model name to the right environment's schema and hands dbt the edges of its dependency graph
    bloom: understand
  - id: M1-3
    text: Apply source declarations and the source() function so raw loaded tables enter the graph named, described, and freshness-checked
    bloom: apply
