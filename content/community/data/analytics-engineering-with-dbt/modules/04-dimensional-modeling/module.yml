schema_version: 1
module: 04-dimensional-modeling
title: Dimensional modeling - facts, dimensions, grain
status: skeleton
serves: [O4]
prerequisites: [01-models-and-the-dag]
est_hours: 4
concepts:                      # siblings: the two table kinds, the declaration that anchors them, the shape argument
  - facts-and-dimensions
  - declared-grain
  - star-vs-normalized
objectives:
  - id: M4-1
    text: Explain Kimball's split between fact tables holding numeric measurements and dimension tables holding the descriptive context recorded with them
    bloom: understand
  - id: M4-2
    text: Apply the four-step design process to a business process, declaring what one fact-table row represents before picking dimensions and facts
    bloom: apply
  - id: M4-3
    text: Analyze why analytical workloads favor a denormalized star schema over third normal form - fewer joins for consumers, reusable dimensions, faster aggregation
    bloom: analyze
