objectives:
  - id: M5-1
    text: Explain the classic responses to a changed dimension attribute - overwrite (type 1), add a new row (type 2), alternate reality (type 3) - and what each preserves or destroys
    bloom: understand
  - id: M5-2
    text: Apply dbt snapshots with the timestamp or check strategy to record type 2 history in dbt_valid_from and dbt_valid_to columns
    bloom: apply
  - id: M5-3
    text: Apply as-of join logic that picks the dimension row whose validity range contained the fact's event time
    bloom: apply
