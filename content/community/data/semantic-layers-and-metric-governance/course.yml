hub: ./semantic-layers-and-metric-governance-hub.md
objectives:
  - id: O1
    text: Analyze how one business metric label comes to mean several different numbers when each reporting tool embeds its own formula, and explain why tool-local definitions drift further apart over time
    bloom: analyze
    assessed_by: a written post-mortem of a real or constructed metric-drift incident tracing each divergent number back to the tool-local formula that produced it
  - id: O2
    text: Explain how a semantic layer captures a metric definition once - as measures, dimensions, and entities - and exposes cubes or views as the single query interface every downstream consumer shares
    bloom: understand
    assessed_by: a written walkthrough of one metric's path from warehouse column to dashboard, naming the semantic-layer component responsible for each step
  - id: O3
    text: Analyze when pre-aggregations are worth their build and refresh cost, and how an incoming query is matched to a pre-built rollup instead of scanning source tables
    bloom: analyze
    assessed_by: a written analysis of a slow-dashboard scenario deciding which queries deserve a pre-aggregation, with the matching rules and refresh trade-offs stated
  - id: O4
    text: Evaluate a governance process for metric definitions - ownership, change review, versioned definitions, and parity testing - against the failure modes each control exists to prevent
    bloom: evaluate
    assessed_by: a written review of a proposed metric-change workflow identifying which control catches each of several seeded failure scenarios, justified from the cited practices
