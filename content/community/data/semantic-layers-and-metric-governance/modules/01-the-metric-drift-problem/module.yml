objectives:
  - id: M1-1
    text: Analyze a metric-drift incident, tracing each divergent number for the same label back to the different formula each tool embeds
    bloom: analyze
  - id: M1-2
    text: Explain why formulas locked inside individual reporting tools rot - duplicated logic, silent edits, and no shared review path
    bloom: understand
  - id: M1-3
    text: Explain the define-once-serve-everywhere principle and what moving definitions out of the reporting layer changes for every consumer
    bloom: understand
