objectives:
  - id: M3-1
    text: Explain why serving every dashboard query straight from source tables stops scaling as data volume and query concurrency grow
    bloom: understand
  - id: M3-2
    text: Analyze whether a given query workload justifies a pre-aggregation, weighing response time and concurrency gains against build and refresh cost
    bloom: analyze
  - id: M3-3
    text: Explain the rules that match an incoming query to a rollup - members, additivity, time granularity - and how refresh keys bound how stale served data can get
    bloom: understand
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Caching overview (Cube documentation)"
    url: https://docs.cube.dev/docs/pre-aggregations
    archived_url: https://web.archive.org/web/20260604152613/https://docs.cube.dev/docs/pre-aggregations
    accessed: 2026-08-05
    source_type: web
    why: describes the two-level cache - in-memory by default, pre-aggregations by explicit configuration - and the claim that pre-aggregations dramatically improve query performance and provide higher concurrency
  - title: "Getting started with pre-aggregations (Cube documentation)"
    url: https://docs.cube.dev/docs/pre-aggregations/getting-started-pre-aggregations
    archived_url: https://web.archive.org/web/20260508151339/https://docs.cube.dev/docs/pre-aggregations/getting-started-pre-aggregations
    accessed: 2026-08-05
    source_type: web
    why: defines a pre-aggregation as a condensed version of the source data stored in a dedicated layer, reducing dataset size by orders of magnitude, with refresh keys checking freshness and background rebuilds - the mechanics both remaining lessons rest on
  - title: "Matching queries with pre-aggregations (Cube documentation)"
    url: https://docs.cube.dev/docs/pre-aggregations/matching-pre-aggregations
    archived_url: https://web.archive.org/web/20260508150754/https://docs.cube.dev/docs/pre-aggregations/matching-pre-aggregations
    accessed: 2026-08-05
    source_type: web
    why: states the matching rules the third lesson teaches - the rollup must contain all dimensions, filter dimensions, and leaf measures from the query, leaf measures must be additive, and time granularity and time zone must align
