schema_version: 1
module: 02-joins-as-row-matching
title: Joins as row matching
status: skeleton
serves: [O2]
prerequisites: [01-query-execution]
est_hours: 3
concepts:
  - join-types
  - join-keys
  - null-join-behavior
objectives:
  - id: M2-1
    text: Explain each join type - inner, left, right, full, cross - in terms of which row pairs it keeps and which unmatched rows it null-extends
    bloom: understand
  - id: M2-2
    text: Apply join conditions on join keys with ON and USING to combine two tables, predicting the resulting row count before running the query
    bloom: apply
  - id: M2-3
    text: Analyze how NULLs behave in join conditions and comparisons, including why a NULL join key never matches anything
    bloom: analyze
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Table Expressions - PostgreSQL documentation"
    url: https://www.postgresql.org/docs/current/queries-table-expressions.html
    archived_url: https://web.archive.org/web/20260804103651/https://www.postgresql.org/docs/current/queries-table-expressions.html
    accessed: 2026-08-05
    source_type: web
    why: defines each join type's row-matching behavior - inner keeps matching pairs, left and right and full null-extend unmatched rows, cross join is the Cartesian product - plus the ON, USING, and table-alias forms the join-keys lesson uses
  - title: "SQL Joins - former Mode SQL tutorial (ThoughtSpot)"
    url: https://www.thoughtspot.com/sql-tutorial/sql-joins
    archived_url: https://web.archive.org/web/20260312045125/https://www.thoughtspot.com/sql-tutorial/sql-joins
    accessed: 2026-08-05
    source_type: web
    why: the tutorial's join-key framing - two mapped columns referred to as foreign keys or join keys - and its worked players-to-teams join ground the join-keys lesson in a concrete relational example
  - title: "Comparison Functions and Operators - PostgreSQL documentation"
    url: https://www.postgresql.org/docs/current/functions-comparison.html
    archived_url: https://web.archive.org/web/20260721181915/https://www.postgresql.org/docs/current/functions-comparison.html
    accessed: 2026-08-05
    source_type: web
    why: states the comparison rule the NULL lesson rests on - ordinary comparison operators yield null, signifying unknown, rather than true or false when either input is null - which is why a NULL join key never matches, plus the IS NULL and IS NOT DISTINCT FROM alternatives
  - title: "NULL Handling in SQLite - SQLite documentation"
    url: https://www.sqlite.org/nulls.html
    archived_url: https://web.archive.org/web/20260731121940/https://www.sqlite.org/nulls.html
    accessed: 2026-08-05
    source_type: web
    why: documents the cross-engine DISTINCT vs UNIQUE inconsistency the NULL lesson covers - NULLs stay distinct in a UNIQUE column but are indistinct for SELECT DISTINCT and UNION, a behavior SQLite adopted to match Oracle, PostgreSQL, and DB2
