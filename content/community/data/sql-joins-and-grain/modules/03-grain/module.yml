schema_version: 1
module: 03-grain
title: Grain - what one row means
status: skeleton
serves: [O3]
prerequisites: []
est_hours: 2
concepts:
  - table-grain
  - grain-declaration
  - primary-key-thinking
objectives:
  - id: M3-1
    text: Explain what the grain of a table is - exactly what a single row represents - and why every measure and attribute must be consistent with it
    bloom: understand
  - id: M3-2
    text: Apply grain declaration in business terms to each table of a schema before writing queries against it
    bloom: apply
  - id: M3-3
    text: Analyze whether a table's declared grain actually holds by identifying its primary key and checking the declared key for duplicates
    bloom: analyze
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Grain - Kimball Group dimensional modeling techniques"
    url: https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/grain/
    archived_url: https://web.archive.org/web/20260306023852/https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/grain/
    accessed: 2026-08-05
    source_type: web
    why: defines grain - the grain establishes exactly what a single fact table row represents - and requires declaring it before choosing dimensions or facts, the module's central discipline
  - title: "Declaring the Grain - Ralph Kimball, Kimball Group"
    url: https://www.kimballgroup.com/2003/03/declaring-the-grain/
    archived_url: https://web.archive.org/web/20260512133704/https://www.kimballgroup.com/2003/03/declaring-the-grain/
    accessed: 2026-08-05
    source_type: web
    why: the long-form argument for stating grain in business terms and what fails without it - designs resting on quicksand, and facts untrue to the grain producing nonsensical results when combined
  - title: "Constraints - PostgreSQL documentation"
    url: https://www.postgresql.org/docs/current/ddl-constraints.html
    archived_url: https://web.archive.org/web/20260803152840/https://www.postgresql.org/docs/current/ddl-constraints.html
    accessed: 2026-08-05
    source_type: web
    why: primary keys as the mechanical form of a grain declaration - a column or group of columns usable as a unique identifier for rows, required unique and not null, at most one per table
