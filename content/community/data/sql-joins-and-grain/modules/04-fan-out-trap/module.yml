schema_version: 1
module: 04-fan-out-trap
title: The fan-out trap
status: skeleton
serves: [O4]
prerequisites: [02-joins-as-row-matching, 03-grain]
est_hours: 3
concepts:
  - join-fan-out
  - fan-out-detection
  - fan-out-repair
objectives:
  - id: M4-1
    text: Explain how joining a one-to-many relationship repeats each row from the one side and silently inflates SUM and COUNT computed over the joined result
    bloom: understand
  - id: M4-2
    text: Analyze a joined result for fan-out by comparing its row count against the expected grain and COUNT of all rows against COUNT DISTINCT of the key
    bloom: analyze
  - id: M4-3
    text: Apply pre-aggregation and EXISTS semi-joins to repair queries whose measures a fan-out inflated
    bloom: apply
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Understanding symmetric aggregates - Looker documentation"
    url: https://docs.cloud.google.com/looker/docs/best-practices/understanding-symmetric-aggregates
    archived_url: https://web.archive.org/web/20260213175954/https://docs.cloud.google.com/looker/docs/best-practices/understanding-symmetric-aggregates
    accessed: 2026-08-05
    source_type: web
    why: the canonical fan-out walkthrough - a one-to-many orders-to-items join repeats order totals, inflating SUM from 124.84 to 223.44 in its example - and the DISTINCT-over-a-primary-key repair strategy
  - title: "Subquery Expressions - PostgreSQL documentation"
    url: https://www.postgresql.org/docs/current/functions-subquery.html
    archived_url: https://web.archive.org/web/20260801012650/https://www.postgresql.org/docs/current/functions-subquery.html
    accessed: 2026-08-05
    source_type: web
    why: EXISTS semantics for the semi-join repair - true if the subquery returns at least one row, so the outer row is filtered rather than multiplied - plus the NOT IN NULL trap the repair lesson warns about
  - title: "Table Expressions - PostgreSQL documentation"
    url: https://www.postgresql.org/docs/current/queries-table-expressions.html
    archived_url: https://web.archive.org/web/20260804103651/https://www.postgresql.org/docs/current/queries-table-expressions.html
    accessed: 2026-08-05
    source_type: web
    why: the join mechanics the trap rests on - an inner or outer join emits one output row per matching pair, so a one-side row with three matches appears three times
