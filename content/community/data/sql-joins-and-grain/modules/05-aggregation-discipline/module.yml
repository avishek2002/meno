schema_version: 1
module: 05-aggregation-discipline
title: Aggregation discipline
status: skeleton
serves: [O5]
prerequisites: [01-query-execution, 03-grain]
est_hours: 3
concepts:
  - group-by-grain-contract
  - window-functions
  - groupby-vs-window-choice
objectives:
  - id: M5-1
    text: Explain the GROUP BY contract - the grouped columns define the output grain, and every other column must arrive through an aggregate expression
    bloom: understand
  - id: M5-2
    text: Apply window functions to add calculations over related rows while each row keeps its identity, using OVER with PARTITION BY and ORDER BY
    bloom: apply
  - id: M5-3
    text: Evaluate whether a reporting question needs GROUP BY, a window function, or both, based on the grain the answer should have
    bloom: evaluate
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Aggregate Functions - PostgreSQL tutorial"
    url: https://www.postgresql.org/docs/current/tutorial-agg.html
    archived_url: https://web.archive.org/web/20260720235713/https://www.postgresql.org/docs/current/tutorial-agg.html
    accessed: 2026-08-05
    source_type: web
    why: aggregates compute a single result from multiple input rows and GROUP BY yields one output row per group - the contract half of the module - plus the WHERE vs HAVING boundary restated for grouped queries
  - title: "Window Functions - PostgreSQL tutorial"
    url: https://www.postgresql.org/docs/current/tutorial-window.html
    archived_url: https://web.archive.org/web/20260803135252/https://www.postgresql.org/docs/current/tutorial-window.html
    accessed: 2026-08-05
    source_type: web
    why: defines window functions against aggregates - rows retain their separate identities while a calculation runs across related rows via OVER, PARTITION BY, and ORDER BY - the other half of the choice this module teaches
  - title: "Table Expressions - PostgreSQL documentation"
    url: https://www.postgresql.org/docs/current/queries-table-expressions.html
    archived_url: https://web.archive.org/web/20260804103651/https://www.postgresql.org/docs/current/queries-table-expressions.html
    accessed: 2026-08-05
    source_type: web
    why: the enforcement of the grain contract - in a grouped table, columns not listed in GROUP BY cannot be referenced except in aggregate expressions
  - title: "SQL Window Functions - former Mode SQL tutorial (ThoughtSpot)"
    url: https://www.thoughtspot.com/sql-tutorial/sql-window-functions
    archived_url: https://web.archive.org/web/20260414145456/https://www.thoughtspot.com/sql-tutorial/sql-window-functions
    accessed: 2026-08-05
    source_type: web
    why: the practical window-function catalog - running totals, ROW_NUMBER, RANK, LAG and LEAD with worked bikeshare examples - feeding the choosing lesson's exercises
