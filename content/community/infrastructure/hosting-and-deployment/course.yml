schema_version: 1
slug: hosting-and-deployment
title: Hosting and deployment
created: 2026-08-06
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./hosting-and-deployment-hub.md
objectives:                    # every verb at or below an analyze ceiling: judgement about where things run, not hands-on operations
  - id: O1
    text: Classify the components of a running web application onto the hosting-shape map - static and content delivery network, edge runtime, serverless function, container or platform-as-a-service, virtual machine, managed data service, inference endpoint - and name the responsibility boundary separating each from its neighbour
    bloom: analyze
    assessed_by: a labelled decomposition of one of the learner's own projects, every component placed on the map and every boundary named, graded by the module 1 and module 3 transfer prompts
  - id: O2
    text: Compare two candidate hosting shapes for a stated workload on the axes that actually differ - cold start, execution ceiling, statefulness, concurrency, data locality, egress - and defend the choice against the runner-up
    bloom: analyze
    assessed_by: a written two-shape comparison for a named workload in which the losing option's disqualifying limit is quoted from the vendor's own documentation
  - id: O3
    text: Trace one user request end to end across name resolution, transport security, content delivery network and origin, the interface boundary, identity, and the database, and locate the layer at which a described failure surfaces
    bloom: analyze
    assessed_by: an annotated end-to-end request trace plus correct localisation of four injected failure descriptions to their layer, graded in the module 5 and module 6 reviews
  - id: O4
    text: Diagnose which documented limit breaks a given architecture and select the standard bridge for it, naming what the bridge itself costs
    bloom: analyze
    assessed_by: a limit-to-bridge table across five failing scenarios, each row naming the cost the bridge adds, graded by the module 8 transfer prompt
  - id: O5
    text: Evaluate a named platform against a stated workload using its own published limits and pricing, stating where it excels, where it stops, and what leaving would cost
    bloom: analyze
    assessed_by: a platform assessment whose every claim is traced to the vendor page that supports it, closing with an exit-cost paragraph
  - id: O6
    text: Determine how a language-model call should be hosted inside a service - hosted inference application programming interface, self-hosted open weights, or a proxy at the edge - given latency, streaming, timeout and cost constraints
    bloom: analyze
    assessed_by: a hosting decision for one concrete language-model feature, justified against a serverless timeout and a streaming requirement quoted from documentation
