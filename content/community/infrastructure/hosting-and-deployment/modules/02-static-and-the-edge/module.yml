schema_version: 1
module: 02-static-and-the-edge
title: Static hosting and the edge
status: skeleton
serves: [O1, O2]
prerequisites: [01-what-hosting-is]
est_hours: 4
concepts:                      # siblings: shipping bytes, copying bytes closer, running code where the copies live
  - static-hosting
