schema_version: 1
module: 06-identity-config-and-secrets
title: Identity, configuration, and the deploy seam
status: skeleton
serves: [O3]
prerequisites: [05-one-request-end-to-end]
est_hours: 3
concepts:                      # siblings: who may act, what the running copy is told, how the copy gets there
