schema_version: 1
module: 07-hosting-an-llm
title: Putting a language model inside a service
status: skeleton
serves: [O6]
prerequisites: [03-backend-compute]
est_hours: 5
concepts:                      # siblings: rent the model, run the model, and the response shape that breaks your host
  - hosted-inference-apis
  - self-hosted-inference
