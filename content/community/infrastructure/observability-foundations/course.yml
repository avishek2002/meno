schema_version: 1
slug: observability-foundations
title: Observability foundations
created: 2026-08-05
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./observability-foundations-hub.md
objectives:
  - id: O1
    text: Analyze a production question and choose which of metrics, logs, and traces answers it, grounded in the OpenTelemetry signal definitions and the cost of cardinality
    bloom: analyze
    assessed_by: a written triage of provided production scenarios naming which signal to reach for first and why, including one scenario where cardinality rules a metric out
  - id: O2
    text: Apply Prometheus metric types and PromQL (Prometheus Query Language) selectors to turn counters, gauges, and histograms into queries that answer rate and latency questions
    bloom: apply
    assessed_by: a set of written PromQL expressions over provided metric names, each metric classified by type with the choice justified from the type definitions
  - id: O3
    text: Design a dashboard of panels and template variables that tells one story to one audience, separating system-health views from business views
    bloom: create
    assessed_by: a dashboard plan (panels, queries, variables) for a described service, with a stated goal and audience for each dashboard and a named method for the health view
  - id: O4
    text: Evaluate alert rules written as query, threshold, and duration for symptom-versus-cause framing and fatigue risk
    bloom: evaluate
    assessed_by: a written critique of provided alert rules - each classified as symptom-based or cause-based, its duration clause justified, and fatigue risks named against the paging standards
  - id: O5
    text: Explain how spans and context propagation assemble a distributed trace, and judge when tracing pays for itself in a given system
    bloom: evaluate
    assessed_by: a written walkthrough of one request across two services naming the trace and span identifiers at each hop, plus a justified call on whether a described system warrants tracing
