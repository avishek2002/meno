schema_version: 1
module: 01-three-signals
title: The three signals - metrics, logs, and traces
status: skeleton
serves: [O1]
prerequisites: []
est_hours: 3
concepts:                      # siblings: what each signal is, what labels cost, which lens to reach for
  - signal-definitions
  - cardinality
  - choosing-a-lens
objectives:
  - id: M1-1
    text: Explain what metrics, logs, and traces each record, using the OpenTelemetry signal definitions
    bloom: understand
  - id: M1-2
    text: Explain cardinality and why every distinct label combination becomes its own time series with its own resource cost
    bloom: understand
  - id: M1-3
    text: Analyze a production question and choose which signal to reach for first, naming what the other two lenses would miss
    bloom: analyze
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Signals (OpenTelemetry documentation)"
    url: https://opentelemetry.io/docs/concepts/signals/
    archived_url: https://web.archive.org/web/20260626061613/https://opentelemetry.io/docs/concepts/signals/
    accessed: 2026-08-05
    source_type: web
    why: defines the signal set the module names its lenses after - traces as the path of a request through an application, metrics as a measurement captured at runtime, logs as a recording of an event
  - title: "Observability primer (OpenTelemetry documentation)"
    url: https://opentelemetry.io/docs/concepts/observability-primer/
    archived_url: https://web.archive.org/web/20260624134334/https://opentelemetry.io/docs/concepts/observability-primer/
    accessed: 2026-08-05
    source_type: web
    why: the working definitions the module leans on - observability as understanding a system from the outside, logs as timestamped messages that gain value when correlated with traces, metrics as aggregations of numeric data over time
  - title: "Data model (Prometheus documentation)"
    url: https://prometheus.io/docs/concepts/data_model/
    archived_url: https://web.archive.org/web/20260704050216/https://prometheus.io/docs/concepts/data_model/
    accessed: 2026-08-05
    source_type: web
    why: source of the cardinality mechanism the module teaches - changing any label value, or adding or removing a label, creates a new time series
  - title: "Instrumentation best practices (Prometheus documentation)"
    url: https://prometheus.io/docs/practices/instrumentation/
    archived_url: https://web.archive.org/web/20260801040020/https://prometheus.io/docs/practices/instrumentation/
    accessed: 2026-08-05
    source_type: web
    why: the concrete cardinality budget - keep metric cardinality below about 10, investigate anything over 100, because each labelset costs RAM, CPU, disk, and network
