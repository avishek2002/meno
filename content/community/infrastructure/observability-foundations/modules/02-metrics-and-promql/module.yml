objectives:
  - id: M2-1
    text: Apply the Prometheus metric types - counter, gauge, histogram, summary - by picking the right type for a given measurement and justifying it from the type definitions
    bloom: apply
  - id: M2-2
    text: Apply PromQL (Prometheus Query Language) instant and range vector selectors with label matchers to select exactly the series a question needs
    bloom: apply
  - id: M2-3
    text: Apply the series a histogram exposes - bucket counters, sum, and count - to answer request-duration questions a single gauge cannot
    bloom: apply
