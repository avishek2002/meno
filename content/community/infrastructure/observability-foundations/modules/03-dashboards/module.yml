schema_version: 1
module: 03-dashboards
title: Dashboards that answer questions
status: skeleton
serves: [O3]
prerequisites: [02-metrics-and-promql]
est_hours: 3
concepts:                      # siblings: the building block, the reuse mechanism, the design judgment
  - panels-and-queries
  - template-variables
  - dashboard-audience
objectives:
  - id: M3-1
    text: Explain a Grafana panel as a query plus a visualization, and match visualization choices to the shape of the data
    bloom: understand
  - id: M3-2
    text: Apply template variables so a single dashboard serves many services or environments without duplication
    bloom: apply
  - id: M3-3
    text: Design dashboards with a stated goal and audience, separating system-health views built on a named method from business-facing views
    bloom: create
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Panels and visualizations (Grafana documentation)"
    url: https://grafana.com/docs/grafana/latest/visualizations/panels-visualizations/
    archived_url: https://web.archive.org/web/20260714225111/https://grafana.com/docs/grafana/latest/visualizations/panels-visualizations/
    accessed: 2026-08-05
    source_type: web
    why: defines the panel as the basic dashboard building block, composed of a query and a visualization of the query results
  - title: "Variables (Grafana documentation)"
    url: https://grafana.com/docs/grafana/latest/visualizations/dashboards/variables/
    archived_url: https://web.archive.org/web/20260710115951/https://grafana.com/docs/grafana/latest/visualizations/dashboards/variables/
    accessed: 2026-08-05
    source_type: web
    why: defines a dashboard variable as a placeholder referenced with dollar syntax, letting viewers change what a dashboard shows without editing it and letting one dashboard replace many near-copies
  - title: "Dashboard best practices (Grafana documentation)"
    url: https://grafana.com/docs/grafana/latest/visualizations/dashboards/build-dashboards/best-practices/
    archived_url: https://web.archive.org/web/20260730002843/https://grafana.com/docs/grafana/latest/visualizations/dashboards/build-dashboards/best-practices/
    accessed: 2026-08-05
    source_type: web
    why: the design judgment the audience lesson teaches - a dashboard should tell a story or answer a question, the USE (utilization, saturation, errors) and RED (rate, errors, duration) methods, and avoiding dashboard sprawl
