schema_version: 1
module: 04-alerting
title: Alerting without the fatigue
status: skeleton
serves: [O4]
prerequisites: [02-metrics-and-promql]
est_hours: 4
concepts:                      # siblings: what a rule is, what to alert on, what alerting costs humans
  - alert-rule-anatomy
  - symptom-vs-cause
