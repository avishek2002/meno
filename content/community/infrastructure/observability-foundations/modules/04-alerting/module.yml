objectives:
  - id: M4-1
    text: Explain an alert rule as a query, a threshold, and a duration, including how the pending state guards against flapping
    bloom: understand
  - id: M4-2
    text: Analyze alerts as symptom-based or cause-based - what is broken versus why - and identify which framing should page a human
    bloom: analyze
  - id: M4-3
    text: Evaluate a set of alerts against the paging standards - urgent, actionable, requiring intelligence - and name the fatigue risks they carry
    bloom: evaluate
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Monitoring distributed systems (Google Site Reliability Engineering book)"
    url: https://sre.google/sre-book/monitoring-distributed-systems/
    archived_url: https://web.archive.org/web/20260803101906/https://sre.google/sre-book/monitoring-distributed-systems/
    accessed: 2026-08-05
    source_type: web
    why: the symptom-versus-cause distinction (what is broken versus why), the four golden signals, and the paging standards - urgent, actionable, requiring intelligence - the module evaluates alerts against
  - title: "Practical alerting from time-series data (Google Site Reliability Engineering book)"
    url: https://sre.google/sre-book/practical-alerting/
    archived_url: https://web.archive.org/web/20260531211804/https://sre.google/sre-book/practical-alerting/
    accessed: 2026-08-05
    source_type: web
    why: time-series rule evaluation at scale and the minimum-duration guard against flapping alerts - hold a rule true for at least two evaluation cycles before sending - plus the blind spots of white-box monitoring
  - title: "Alerting rules (Prometheus documentation)"
    url: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
    archived_url: https://web.archive.org/web/20260708190934/https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
    accessed: 2026-08-05
    source_type: web
    why: the concrete rule anatomy the module dissects - an expr condition, a for duration during which the alert sits pending, and labels and annotations that route and explain it
