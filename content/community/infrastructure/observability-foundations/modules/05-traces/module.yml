schema_version: 1
module: 05-traces
title: Traces and context propagation
status: skeleton
serves: [O5]
prerequisites: [01-three-signals]
est_hours: 3
concepts:                      # siblings: the unit, the mechanism, the judgment call
  - spans
  - context-propagation
  - when-tracing-pays
objectives:
  - id: M5-1
    text: Explain spans as the building blocks of a trace - attributes, events, links, status, and kind - and what a root span represents
    bloom: understand
  - id: M5-2
    text: Explain how context propagation carries a trace ID and parent span ID between services so spans assemble into one trace, using the W3C (World Wide Web Consortium) traceparent header format
    bloom: understand
  - id: M5-3
    text: Evaluate whether a described system warrants distributed tracing, weighing what its metrics and logs already answer against what only a request-scoped view can show
    bloom: evaluate
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
