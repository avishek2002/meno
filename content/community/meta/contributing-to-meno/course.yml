    text: Apply the pack gate - validation checks, a citation audit, and the sanitization attestations - to a draft pack and resolve every finding that names it
    bloom: apply
    assessed_by: a validate run with zero findings naming the pack, one adversarial audit of the pack's own citations, and a completed community-tier checklist from the pull request template
