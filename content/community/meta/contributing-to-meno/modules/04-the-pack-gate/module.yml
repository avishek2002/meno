objectives:
  - id: M4-1
    text: Run the validate gate on a draft pack and resolve every finding that names it, attributing each to its check
    bloom: apply
  - id: M4-2
    text: Audit one of the draft pack's own citations adversarially - fetch the live source, check claim support, check the archive snapshot matches
    bloom: apply
  - id: M4-3
    text: Complete the pull-request template's community-tier attestations honestly for the drafted pack, flagging anything a human reviewer must judge
    bloom: apply
