schema_version: 1
slug: web-accessibility-audits
title: Web accessibility audits
created: 2026-08-05
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./web-accessibility-audits-hub.md
objectives:
  - id: O1
    text: Explain how interfaces fail people with visual, motor, auditory, and cognitive disabilities, mapping each failure to the WCAG principle it violates and the assistive technology it blocks
    bloom: understand
    assessed_by: a written classification of real page defects by POUR principle, naming for each the assistive technology or user group the defect shuts out
  - id: O2
    text: Apply keyboard-only operation checks - tab order, visible focus, and focus management in modal dialogs - to find and repair operability failures
    bloom: apply
    assessed_by: a keyboard-only walkthrough log of a page plus a repair for every trap, illogical jump, or invisible-focus defect it records
  - id: O3
    text: Apply the accessible name and role model to interface controls, choosing semantic HTML first and reaching for ARIA attributes only where no native element carries the needed semantics
    bloom: apply
    assessed_by: a remediation of unlabeled or wrongly-roled controls with a stated semantic-HTML-first justification for each fix
  - id: O4
    text: Apply the WCAG 2.2 AA visual criteria - contrast minimums, the 24 by 24 pixel target size, and reduced-motion preferences - to a page's styling
    bloom: apply
    assessed_by: a styling review that measures contrast ratios, target sizes, and motion behavior against the AA thresholds and corrects each miss
  - id: O5
    text: Evaluate a complete interface audit, separating DOM-confirmed failures from high-confidence judgment calls and writing each finding with a severity and a fix a developer can act on
    bloom: evaluate
    assessed_by: an audit report over a sampled set of pages with every finding tagged confirmed or judgment, rated for severity, and paired with a concrete remediation
modules:                       # ordered; every field here mirrors module.yml at regen time
