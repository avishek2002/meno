schema_version: 1
module: 01-how-accessibility-fails
title: How accessibility fails and who it fails
status: skeleton
serves: [O1]
prerequisites: []
est_hours: 3
concepts:
  - pour-principles
  - disability-and-assistive-tech
  - common-failure-patterns
objectives:
  - id: M1-1
    text: Explain the four POUR principles - perceivable, operable, understandable, robust - and classify page defects by the principle each violates
    bloom: understand
  - id: M1-2
    text: Explain how screen readers, keyboard emulators, and other assistive technologies consume a page, and what each needs from the markup to work
    bloom: understand
  - id: M1-3
    text: Explain which failures dominate the real web - low contrast, missing alternative text, missing labels, empty links - using large-sample survey evidence
    bloom: understand
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Introduction to Web Accessibility (W3C Web Accessibility Initiative)"
    url: https://www.w3.org/WAI/fundamentals/accessibility-intro/
    archived_url: https://web.archive.org/web/20260730163844/https://www.w3.org/WAI/fundamentals/accessibility-intro/
    accessed: 2026-08-05
    source_type: web
    why: defines web accessibility as people with disabilities being able to perceive, understand, navigate, and interact with the web, and lists the disability groups and situational limits the failures lesson maps defects onto
  - title: "Web Content Accessibility Guidelines (WCAG) 2.2 (W3C Recommendation)"
    url: https://www.w3.org/TR/WCAG22/
    archived_url: https://web.archive.org/web/20260804030006/https://www.w3.org/TR/WCAG22/
    accessed: 2026-08-05
    source_type: web
    why: the normative standard the whole pack audits against - source of the four POUR principles and the A, AA, AAA conformance levels the principles lesson teaches
  - title: "The WebAIM Million - annual accessibility analysis of the top 1,000,000 home pages (WebAIM)"
    url: https://webaim.org/projects/million/
    archived_url: https://web.archive.org/web/20260802181357/https://webaim.org/projects/million/
    accessed: 2026-08-05
    source_type: web
    why: large-sample evidence for the failure-patterns lesson - six error types (led by low-contrast text on 83.9 percent of pages) account for 96 percent of detected errors
  - title: "Screen Reader User Survey #10 Results (WebAIM)"
    url: https://webaim.org/projects/screenreadersurvey10/
    archived_url: https://web.archive.org/web/20260630101645/https://webaim.org/projects/screenreadersurvey10/
    accessed: 2026-08-05
    source_type: web
    why: real screen reader usage data for the assistive-tech lesson - which screen readers people use and that 71.6 percent navigate long pages by headings first
