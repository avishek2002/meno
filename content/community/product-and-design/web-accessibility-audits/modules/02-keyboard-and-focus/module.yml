schema_version: 1
module: 02-keyboard-and-focus
title: Keyboard and focus
status: skeleton
serves: [O2]
prerequisites: [01-how-accessibility-fails]
est_hours: 4
concepts:
  - keyboard-operability
  - focus-order
  - visible-focus
  - dialog-focus-management
objectives:
  - id: M2-1
    text: Explain the keyboard success criterion - all functionality operable through a keyboard interface - and identify where its path-dependent input exception genuinely applies
    bloom: understand
  - id: M2-2
    text: Apply a keyboard-only pass to verify tab order preserves meaning and operability, fixing source-order defects rather than patching with positive tabindex values
    bloom: apply
  - id: M2-3
    text: Apply focus styling that keeps the keyboard focus indicator visible, enhancing outlines instead of removing them
    bloom: apply
  - id: M2-4
    text: Apply the modal dialog pattern - focus moves in on open, stays inside while open, Escape closes, and focus returns to the invoker on close
    bloom: apply
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Understanding Success Criterion 2.1.1: Keyboard (WCAG 2.2, W3C)"
    url: https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
    archived_url: https://web.archive.org/web/20260803052214/https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
    accessed: 2026-08-05
    source_type: web
    why: the normative intent behind the operability lesson - all functionality keyboard-operable at Level A, the path-dependent input exception, and the keyboard emulators (speech input, sip-and-puff) the criterion protects
  - title: "Understanding Success Criterion 2.4.3: Focus Order (WCAG 2.2, W3C)"
    url: https://www.w3.org/WAI/WCAG22/Understanding/focus-order.html
    archived_url: https://web.archive.org/web/20260728181205/https://www.w3.org/WAI/WCAG22/Understanding/focus-order.html
    accessed: 2026-08-05
    source_type: web
    why: defines the tab-order lesson's bar - focus order must preserve meaning and operability - and describes the modal and non-modal dialog focus sequences the dialog lesson builds on
  - title: "Understanding Success Criterion 2.4.7: Focus Visible (WCAG 2.2, W3C)"
    url: https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
    archived_url: https://web.archive.org/web/20260721180058/https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
    accessed: 2026-08-05
    source_type: web
    why: the AA requirement the visible-focus lesson audits against - a mode of operation where the keyboard focus indicator is visible
  - title: "Dialog (Modal) Pattern (W3C ARIA Authoring Practices Guide)"
    url: https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/
    archived_url: https://web.archive.org/web/20260731145433/https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/
    accessed: 2026-08-05
    source_type: web
    why: the canonical modal dialog behavior the dialog lesson teaches - focus in on open, Tab and Shift+Tab stay inside, Escape closes, focus returns to the invoker, role dialog with aria-modal and a label
  - title: "Keyboard Accessibility (WebAIM)"
    url: https://webaim.org/techniques/keyboard/
    archived_url: https://web.archive.org/web/20260723185814/https://webaim.org/techniques/keyboard/
    accessed: 2026-08-05
    source_type: web
    why: the practitioner techniques the fix-oriented lessons apply - enhance rather than remove outlines, let source order drive navigation order, avoid positive tabindex, and watch for keyboard traps
