schema_version: 1
module: 03-names-roles-values
title: Names, roles, and values
status: skeleton
serves: [O3]
prerequisites: [01-how-accessibility-fails]
est_hours: 4
concepts:
  - accessible-names
  - roles-and-semantics
  - aria-last-resort
objectives:
  - id: M3-1
    text: Explain the name, role, value criterion - what assistive technologies must be able to determine programmatically about every control, and why standard HTML controls already satisfy it
    bloom: understand
  - id: M3-2
    text: Apply native HTML labeling - label elements, button text, alternative text - so every control exposes an accessible name
    bloom: apply
  - id: M3-3
    text: Analyze a custom widget against the first rule of ARIA use, deciding when a native element replaces the ARIA scaffolding and when ARIA is genuinely required
    bloom: analyze
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Understanding Success Criterion 4.1.2: Name, Role, Value (WCAG 2.2, W3C)"
    url: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
    archived_url: https://web.archive.org/web/20260730171102/https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
    accessed: 2026-08-05
    source_type: web
    why: the module's normative anchor - name and role programmatically determinable at Level A, standard HTML controls satisfying it by specification, custom controls needing extra work
  - title: "Using ARIA (W3C)"
    url: https://www.w3.org/TR/using-aria/
    archived_url: https://web.archive.org/web/20260723112820/https://www.w3.org/TR/using-aria/
    accessed: 2026-08-05
    source_type: web
    why: source of the first rule of ARIA use - prefer a native HTML element with the semantics built in over re-purposing an element with ARIA - that the last-resort lesson is built around
  - title: "ARIA - Accessibility (MDN Web Docs)"
    url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA
    archived_url: https://web.archive.org/web/20260803181556/https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA
    accessed: 2026-08-05
    source_type: web
    why: explains roles, states, and properties, and the trap the analysis lesson probes - ARIA changes only what assistive technology is told, adding no keyboard behavior or interactivity
  - title: "Creating Accessible Forms - Accessible Form Controls (WebAIM)"
    url: https://webaim.org/techniques/forms/controls
    archived_url: https://web.archive.org/web/20260723190103/https://webaim.org/techniques/forms/controls
    accessed: 2026-08-05
    source_type: web
    why: the labeling techniques the accessible-names lesson applies - explicit for/id association, implicit wrapping, and the click-to-focus benefit labels bring
