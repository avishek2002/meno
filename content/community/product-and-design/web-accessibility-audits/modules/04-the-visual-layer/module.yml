schema_version: 1
module: 04-the-visual-layer
title: The visual layer
status: skeleton
serves: [O4]
prerequisites: [01-how-accessibility-fails]
est_hours: 3
concepts:
  - contrast-minimums
  - target-size
  - reduced-motion
objectives:
  - id: M4-1
    text: Apply the contrast minimums - 4.5 to 1 for normal text, 3 to 1 for large text - measuring ratios and recognizing the incidental-text and logotype exceptions
    bloom: apply
  - id: M4-2
    text: Apply the 24 by 24 CSS pixel target-size minimum and its five exceptions - spacing, equivalent, inline, user agent control, essential - to dense interfaces
    bloom: apply
  - id: M4-3
    text: Apply the prefers-reduced-motion media query so animation respects the user's motion setting
    bloom: apply
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
