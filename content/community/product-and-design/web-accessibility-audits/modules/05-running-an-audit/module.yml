schema_version: 1
module: 05-running-an-audit
title: Running an audit
status: skeleton
serves: [O5]
prerequisites: [02-keyboard-and-focus, 03-names-roles-values, 04-the-visual-layer]
est_hours: 4
concepts:
  - audit-scoping-and-sampling
  - automated-vs-human-checks
  - findings-and-severity
objectives:
  - id: M5-1
    text: Apply the WCAG-EM steps - define scope, explore the product, select a representative sample, evaluate it, report - to plan an audit of a real interface
    bloom: apply
  - id: M5-2
    text: Analyze audit evidence into DOM-confirmed failures versus high-confidence judgment calls, knowing which checks automation can decide and which need a human
    bloom: analyze
  - id: M5-3
    text: Evaluate and write up findings with a severity rating and a developer-actionable fix, so the report produces repairs instead of shelfware
    bloom: evaluate
sources:                       # fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Website Accessibility Conformance Evaluation Methodology (WCAG-EM) 2.0 (W3C Group Note)"
    url: https://www.w3.org/TR/WCAG-EM/
    archived_url: https://web.archive.org/web/20260726165503/https://www.w3.org/TR/WCAG-EM/
    accessed: 2026-08-05
    source_type: web
    why: the scoping lesson's methodology - the five steps from defining scope through reporting, structured plus random sampling, and its position that most accessibility checks are not fully automatable
  - title: "Evaluating Web Accessibility Overview (W3C Web Accessibility Initiative)"
    url: https://www.w3.org/WAI/test-evaluate/
    archived_url: https://web.archive.org/web/20260802172233/https://www.w3.org/WAI/test-evaluate/
    accessed: 2026-08-05
    source_type: web
    why: frames the confirmed-versus-judgment lesson - no tool alone can determine conformance, knowledgeable human evaluation is required, and evaluation should start early and involve users
  - title: "The WebAIM Million - annual accessibility analysis of the top 1,000,000 home pages (WebAIM)"
    url: https://webaim.org/projects/million/
    archived_url: https://web.archive.org/web/20260802181357/https://webaim.org/projects/million/
    accessed: 2026-08-05
    source_type: web
    why: shows what machine-detectable checks against the rendered DOM can and cannot find at scale - the evidence base for the lesson's split between DOM-confirmed failures and human judgment calls
