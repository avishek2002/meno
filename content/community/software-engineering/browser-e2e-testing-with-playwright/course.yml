schema_version: 1
slug: browser-e2e-testing-with-playwright
title: Browser end-to-end testing with Playwright
created: 2026-08-05
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./browser-e2e-testing-with-playwright-hub.md
objectives:
  - id: O1
    text: Explain where browser end-to-end tests sit in a testing strategy, what only a real browser can catch, and why flaky ones cost more than they return
    bloom: understand
    assessed_by: a written sort of an example application's test cases into pyramid layers, with a browser-only justification for each end-to-end candidate and a cost argument for the rejected ones
  - id: O2
    text: Write browser tests around role-based locators and web-first assertions, so they wait for the page instead of sleeping
    bloom: apply
    assessed_by: a rewritten flaky test in which every manual wait and brittle selector is replaced by an auto-waiting locator action or a retrying assertion
  - id: O3
    text: Set up authentication once through saved storage state, and use fixtures so every test stays isolated from its neighbors
    bloom: apply
    assessed_by: a suite in which a setup project signs in once, tests reuse the saved state, and the whole suite passes in any execution order
  - id: O4
    text: Control a test's network traffic and clock, mocking backend responses and time so the run is deterministic
    bloom: apply
    assessed_by: a test that passes with the backend stopped and time fast-forwarded, because its routes are fulfilled with mock data and its clock is installed
  - id: O5
    text: Analyze a growing suite for speed and debuggability, tuning parameterization and worker allocation and reading traces to find a failure's breaking step
    bloom: analyze
    assessed_by: a diagnosis of a slow, occasionally-red suite naming the worker or sharding change, the input matrix that collapses duplicated tests, and the trace evidence behind one failure
