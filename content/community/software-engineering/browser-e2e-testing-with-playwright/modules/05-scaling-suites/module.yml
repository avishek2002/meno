schema_version: 1
module: 05-scaling-suites
title: Scaling and debugging the suite
status: skeleton
serves: [O5]
prerequisites: [03-state-and-auth, 04-network-and-environment]
est_hours: 5
concepts:                      # siblings: multiplying coverage, spending workers, reading failures, running unattended
  - parameterized-tests
  - parallelism-and-sharding
  - trace-debugging
  - ci-execution
objectives:
  - id: M5-1
    text: Generate tests from an input matrix - looped data, project-level options, and external data files - instead of copy-pasting test bodies
    bloom: apply
  - id: M5-2
    text: Analyze a suite's worker allocation, choosing where full parallelism, serial mode, and cross-machine sharding each fit
    bloom: analyze
  - id: M5-3
    text: Analyze a failing run with the trace viewer, reading actions, snapshots, console, and network to find the breaking step
    bloom: analyze
  - id: M5-4
    text: Run the suite unattended - browsers installed with dependencies, reports published as artifacts, traces captured on first retry
    bloom: apply
sources:                       # 4, each fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  # scope fence: the pull request and code review flow around these runs is owned by
  # the software-engineering/git-fundamentals pack - this module points there, not restates it
  - title: "Playwright docs: Parameterize tests"
    url: https://playwright.dev/docs/test-parameterize
    archived_url: https://web.archive.org/web/20260721064741/https://playwright.dev/docs/test-parameterize
    accessed: 2026-08-05
    source_type: web
    why: the parameterization mechanisms the matrix lesson teaches - looping test data, project-level options via test.extend, environment variables, and CSV-driven tests
  - title: "Playwright docs: Parallelism"
    url: https://playwright.dev/docs/test-parallel
    archived_url: https://web.archive.org/web/20260718023724/https://playwright.dev/docs/test-parallel
    accessed: 2026-08-05
    source_type: web
    why: worker processes, files-parallel-by-default versus fullyParallel, limiting workers, why serial mode is discouraged, and sharding across machines
  - title: "Playwright docs: Trace viewer"
    url: https://playwright.dev/docs/trace-viewer
    archived_url: https://web.archive.org/web/20260719181006/https://playwright.dev/docs/trace-viewer
    accessed: 2026-08-05
    source_type: web
    why: what a trace contains (actions, DOM snapshots, console, network, source) and the on-first-retry recording recommendation the debugging lesson follows
  - title: "Playwright docs: Setting up CI"
    url: https://playwright.dev/docs/ci-intro
    archived_url: https://web.archive.org/web/20260721064729/https://playwright.dev/docs/ci-intro
    accessed: 2026-08-05
    source_type: web
    why: the reference automation job - install browsers with dependencies, run the suite, upload the HTML report as an artifact - and the warning that artifacts can hold sensitive data
