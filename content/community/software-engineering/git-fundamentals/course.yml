    title: Remotes, clones, and forks
    status: skeleton
    est_hours: 4
    serves: [O5]
  - n: 4
    slug: 04-pull-request-flow
    title: The pull request flow
    status: skeleton
    est_hours: 5
    serves: [O6]
  - n: 5
    slug: 05-repo-hygiene
    title: Repository hygiene
    status: skeleton
    est_hours: 2
