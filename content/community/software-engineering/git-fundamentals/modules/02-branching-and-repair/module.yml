  - title: "git-reflog (official reference)"
    url: https://git-scm.com/docs/git-reflog
    archived_url: https://web.archive.org/web/20260805055131/https://git-scm.com/docs/git-reflog
    accessed: 2026-08-05
    source_type: web
    why: documents the reflog as the safety net for recovering commits after a bad reset or a deleted branch
