    accessed: 2026-08-05
    source_type: web
    why: explains why branches are cheap movable pointers, the mental model the branching lesson builds on
  - title: "Pro Git, ch. 3.2: Basic Branching and Merging"
    url: https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging
    archived_url: https://web.archive.org/web/20260805054935/https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging
    accessed: 2026-08-05
    source_type: web
    why: walks fast-forward vs three-way merges and conflict-marker resolution that the merging lesson practices
  - title: "Pro Git, ch. 7.7: Reset Demystified"
    url: https://git-scm.com/book/en/v2/Git-Tools-Reset-Demystified
    archived_url: https://web.archive.org/web/20260805055046/https://git-scm.com/book/en/v2/Git-Tools-Reset-Demystified
    accessed: 2026-08-05
