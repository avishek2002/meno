objectives:
  - id: M2-1
    text: Create and switch branches to isolate a feature's work from main until it is ready to integrate
    bloom: apply
  - id: M2-2
    text: Resolve a merge conflict by interpreting conflict markers and choosing the correct resulting code
    bloom: apply
  - id: M2-3
    text: Choose and apply the matching undo tool, reset, revert, or reflog recovery, for a given mistake without losing work
    bloom: apply
sources:                       # 4, each fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Pro Git, ch. 3.1: Branches in a Nutshell"
    url: https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
