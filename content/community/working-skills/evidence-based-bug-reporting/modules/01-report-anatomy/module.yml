schema_version: 1
module: 01-report-anatomy
title: Anatomy of a reproducible report
status: skeleton
serves: [O1]
prerequisites: []
est_hours: 3
concepts:                      # siblings: the three load-bearing parts of a report
  - minimal-repro-steps
  - expected-vs-actual
  - environment-record
objectives:
  - id: M1-1
    text: Write minimal, exact reproduction steps - each action and its intent - that take a stranger from a clean start to the failure
    bloom: apply
  - id: M1-2
    text: State current and expected behavior as two separate, specific statements instead of a bare "it does not work"
    bloom: apply
  - id: M1-3
    text: Record the environment a stranger needs to reproduce - version or build, operating system, and whether a clean configuration still shows the failure
    bloom: apply
sources:                       # 3, each fetched live and archived at authoring time; see generate-curriculum/references/sourcing.md
  - title: "Bug writing guidelines (Mozilla, Bugzilla page)"
    url: https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html
    archived_url: https://web.archive.org/web/20260712083111/https://bugzilla.mozilla.org/page.cgi?id=bug-writing.html
    accessed: 2026-08-05
    source_type: web
    why: names steps to reproduce the most important part of a bug report and prescribes the anatomy the module teaches - short unique summary, precise steps with the intent of each action, expected versus actual results, build and operating-system details, a fresh-profile check, and one bug per report
  - title: "Bug reporting guidelines (the Chromium Projects)"
    url: https://www.chromium.org/for-testers/bug-reporting-guidelines/
    archived_url: https://web.archive.org/web/20260803040747/https://www.chromium.org/for-testers/bug-reporting-guidelines/
    accessed: 2026-08-05
    source_type: web
    why: a second major project's independent prescription of the same anatomy - detailed reproduction steps, expected behavior, verifying against the latest build and other browsers, and attaching a simplified test or screenshots when they help
  - title: "How to Report Bugs Effectively (Simon Tatham)"
    url: https://www.chiark.greenend.org.uk/~sgtatham/bugs.html
    archived_url: https://web.archive.org/web/20260803213444/https://www.chiark.greenend.org.uk/~sgtatham/bugs.html
    accessed: 2026-08-05
    source_type: web
    why: the classic essay behind the expected-versus-actual lesson - say exactly what you saw and what you expected to see, keep error messages intact with their numbers, and write so the report cannot be misinterpreted
