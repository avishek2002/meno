schema_version: 1
slug: rust-for-backend
title: Rust for backend developers
created: 2026-08-05
status: active                 # active | draft (draft = topic packs not yet adopted)
profile: ./profile.md
hub: ./rust-for-backend-hub.md
objectives:
  - id: O1
    text: Apply Rust's ownership and borrowing rules to write and predict the compilation of small Rust programs
    bloom: apply
    assessed_by: hands-on exercises in modules 1-2 - writing snippets that compile under the borrow checker and correctly predicting why given snippets fail
  - id: O2
    text: Apply Result, Option, and a struct/enum/trait domain model to represent the link-shortener's core data (short codes, redirect targets, click counts)
    bloom: apply
    assessed_by: a compiling domain module from modules 3-4, covered by tests, using Result-based error handling
  - id: O3
    text: Build a working HTTP layer with Axum and basic async that serves the link-shortener's create-short-link and redirect endpoints
    bloom: apply
    assessed_by: a running Axum service, exercised with real HTTP requests, that creates a short link and redirects it
  - id: O4
    text: Apply an embedded persistence store so the service's short-code mappings and click counts survive a restart
    bloom: apply
    assessed_by: the module 6 service demonstrated to return the same data after being stopped and restarted
  - id: O5
    text: Build, package, and run the complete link-shortener as a release binary sized to run cheaply
    bloom: apply
    assessed_by: a cargo build --release binary run locally end-to-end as the finished service
