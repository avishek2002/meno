schema_version: 1
slug: git-fundamentals
title: Git fundamentals
created: 2026-08-05
status: draft                  # topic pack: pre-contract, not yet adopted by a tenant
hub: ./git-fundamentals-hub.md
objectives:
  - id: O1
    text: Apply the staging model to craft atomic, well-messaged commits that isolate one logical change each
    bloom: apply
    assessed_by: a sequence of commits, built by splitting a provided messy diff, that each stage and message exactly one logical change
  - id: O2
    text: Apply git log, diff, and blame to reconstruct why a specific line of code changed and who to ask about it
    bloom: apply
    assessed_by: a written trace of one file's history naming the commit, author, and rationale behind a given line
  - id: O3
    text: Apply branching and merging to isolate work and integrate it, resolving merge conflicts by hand
    bloom: apply
    assessed_by: a merged branch, built from a provided conflicting scenario, with conflict markers resolved and no changes lost
  - id: O4
    text: Apply reset, revert, and reflog to undo a mistake without losing work
    bloom: apply
    assessed_by: recovery of a deliberately broken repository state to a known-good point using the matching undo tool
modules:                       # ordered; every field here mirrors module.yml at regen time
  - n: 1
    slug: 01-commits-and-history
    title: Commits and history
    status: skeleton
    est_hours: 5
    serves: [O1, O2]
  - n: 2
    slug: 02-branching-and-repair
    title: Branching and repair
    status: skeleton
    est_hours: 6
    serves: [O3, O4]
